services:
  sqlserver:
    image: mcr.microsoft.com/mssql/server:2022-latest
    container_name: sqlserver_serena
    ports:
      - "1433:1433"
    environment:
      ACCEPT_EULA: "Y"
      MSSQL_PID: Developer
      MSSQL_SA_PASSWORD: ${SQL_SERVER_SA_PASSWORD:?Set SQL_SERVER_SA_PASSWORD in .env}
    healthcheck:
      test: ["CMD-SHELL", "/opt/mssql-tools18/bin/sqlcmd -S localhost -U sa -P \"$${MSSQL_SA_PASSWORD}\" -Q 'SELECT 1' -C || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 20

  api:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: serena_api
    ports:
      - "5185:8080"
    environment:
      ASPNETCORE_ENVIRONMENT: Development
      Jwt__Key: ${JWT_SIGNING_KEY:-}
      RecaptchaSettings__SecretKey: ${RECAPTCHA_SECRET_KEY:-}
      Email__Smtp__Host: ${SMTP_HOST:-}
      Email__Smtp__Port: ${SMTP_PORT:-587}
      Email__Smtp__Username: ${SMTP_USERNAME:-}
      Email__Smtp__Password: ${SMTP_PASSWORD:-}
      Email__Smtp__From: ${SMTP_FROM:-}
      Email__Smtp__EnableSsl: ${SMTP_ENABLE_SSL:-true}
      ConnectionStrings__DefaultConnection: "Server=sqlserver,1433;Database=serena;User Id=sa;Password=${SQL_SERVER_SA_PASSWORD:?Set SQL_SERVER_SA_PASSWORD in .env};TrustServerCertificate=True;MultipleActiveResultSets=true"
      Cors__AllowedOrigins__0: http://localhost:3000
      Cors__AllowedOrigins__1: http://127.0.0.1:3000
      AdminBootstrap__Email: ${ADMIN_BOOTSTRAP_EMAIL:-}
      AdminBootstrap__Password: ${ADMIN_BOOTSTRAP_PASSWORD:-}
    depends_on:
      sqlserver:
        condition: service_healthy

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: serena_frontend
    ports:
      - "3000:3000"
    environment:
      VITE_API_URL: /api
      VITE_API_PROXY_TARGET: http://api:8080
    depends_on:
      - api
